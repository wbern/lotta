    <script>
      // Recovery killswitch — mirrors src/recovery/killswitch.ts.
            // Loading ?reset=1 unregisters service workers, clears Cache Storage,
            // and reloads. IndexedDB is preserved.
            ;(() => {
              if (new URLSearchParams(location.search).get('reset') !== '1') return
              history.replaceState(null, '', location.pathname + location.hash)
              const swDone = navigator.serviceWorker
                ? navigator.serviceWorker
                    .getRegistrations()
                    .then((rs) => Promise.all(rs.map((r) => r.unregister())))
                : Promise.resolve()
              const cacheDone =
                typeof caches !== 'undefined'
                  ? caches.keys().then((ks) => Promise.all(ks.map((k) => caches.delete(k))))
                  : Promise.resolve()
              Promise.allSettled([swDone, cacheDone]).then(() => location.reload())
            })()
    </script>
