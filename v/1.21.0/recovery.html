<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Lotta — Återställning</title>
    <style>
      :root {
                                            color-scheme: light dark;
                                            --bg: #f0f0f0;
                                            --fg: #111;
                                            --accent: #0066cc;
                                          }
                                          @media (prefers-color-scheme: dark) {
                                            :root {
                                              --bg: #1a1a1a;
                                              --fg: #eee;
                                              --accent: #4477aa;
                                            }
                                          }
                                          html,
                                          body {
                                            margin: 0;
                                            padding: 0;
                                            background: var(--bg);
                                            color: var(--fg);
                                            font-family: system-ui, -apple-system, sans-serif;
                                          }
                                          body {
                                            min-height: 100vh;
                                            display: grid;
                                            place-items: center;
                                            padding: 1.5rem;
                                            box-sizing: border-box;
                                          }
                                          #root {
                                            max-width: 34rem;
                                            text-align: left;
                                          }
                                          #root h1 {
                                            margin: 0 0 1rem;
                                            font-size: 1.5rem;
                                            text-align: center;
                                          }
                                          [data-testid='recovery-diagnostics'] {
                                            background: rgba(127, 127, 127, 0.08);
                                            border-radius: 0.5rem;
                                            padding: 0.75rem 1rem;
                                            margin-bottom: 1rem;
                                            font-size: 0.9rem;
                                          }
                                          .recovery-diag {
                                            margin: 0;
                                            display: grid;
                                            grid-template-columns: max-content 1fr;
                                            gap: 0.25rem 0.75rem;
                                          }
                                          .recovery-diag dt {
                                            font-weight: 600;
                                            color: var(--accent);
                                          }
                                          .recovery-diag dd {
                                            margin: 0;
                                            word-break: break-all;
                                          }
                                          .recovery-diag ul {
                                            margin: 0;
                                            padding-left: 1rem;
                                            max-height: 8rem;
                                            overflow-y: auto;
                                          }
                                          [data-testid='recovery-ios-standalone-note'] {
                                            border: 1px solid var(--accent);
                                            border-radius: 0.5rem;
                                            padding: 0.75rem 1rem;
                                            margin-bottom: 1rem;
                                            font-size: 0.9rem;
                                          }
                                          [data-testid='recovery-ios-standalone-note'] p {
                                            margin: 0.25rem 0;
                                          }
                                          [hidden] {
                                            display: none !important;
                                          }
                                          [data-testid='recovery-actions'] {
                                            display: flex;
                                            flex-direction: column;
                                            gap: 0.25rem;
                                            margin: 1rem 0;
                                          }
                                          [data-testid='recovery-countdown-panel'] {
                                            text-align: center;
                                            margin: 1rem 0;
                                          }
                                          [data-testid='recovery-countdown-panel'] p {
                                            margin: 0;
                                          }
                                          [data-testid='recovery-countdown'] {
                                            font-size: 4rem;
                                            font-weight: 700;
                                            margin: 0.5rem 0 1rem;
                                            color: var(--accent);
                                            font-variant-numeric: tabular-nums;
                                          }
                                          #root button {
                                            display: inline-block;
                                            margin: 0.25rem;
                                            padding: 0.75rem 1.5rem;
                                            font-size: 1rem;
                                            border-radius: 0.5rem;
                                            border: 1px solid currentColor;
                                            background: transparent;
                                            color: inherit;
                                            cursor: pointer;
                                            touch-action: manipulation;
                                            min-height: 44px;
                                          }
                                          #root button[data-testid='recovery-cancel'] {
                                            background: var(--accent);
                                            color: #fff;
                                            border-color: var(--accent);
                                          }
                                          #root button[data-testid='recovery-action-nuke'] {
                                            border-color: #c0392b;
                                            color: #c0392b;
                                          }
                                          @media (prefers-color-scheme: dark) {
                                            #root button[data-testid='recovery-action-nuke'] {
                                              border-color: #e74c3c;
                                              color: #e74c3c;
                                            }
                                          }
                                          #root [data-testid='recovery-action-error'] {
                                            color: #c0392b;
                                            margin-top: 0.5rem;
                                          }
                                          @media (prefers-color-scheme: dark) {
                                            #root [data-testid='recovery-action-error'] {
                                              color: #e74c3c;
                                            }
                                          }
    </style>
    <script type="module" crossorigin src="/v/1.21.0/assets/recovery-D1eDjL5G.js"></script>
    <link rel="modulepreload" crossorigin href="/v/1.21.0/assets/nuke-DWqxxDoR.js">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
