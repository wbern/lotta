<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Lotta — Återställning</title>
    <style>
      :root {
              color-scheme: light dark;
              --bg: #f0f0f0;
              --fg: #111;
              --accent: #0066cc;
            }
            @media (prefers-color-scheme: dark) {
              :root {
                --bg: #1a1a1a;
                --fg: #eee;
                --accent: #4477aa;
              }
            }
            html,
            body {
              margin: 0;
              padding: 0;
              background: var(--bg);
              color: var(--fg);
              font-family: system-ui, -apple-system, sans-serif;
            }
            body {
              min-height: 100vh;
              display: grid;
              place-items: center;
              padding: 1.5rem;
              box-sizing: border-box;
            }
            #root {
              max-width: 28rem;
              text-align: center;
            }
            #root h1 {
              margin: 0 0 1rem;
              font-size: 1.5rem;
            }
            [data-testid='recovery-countdown'] {
              font-size: 4rem;
              font-weight: 700;
              margin: 1.5rem 0;
              color: var(--accent);
              font-variant-numeric: tabular-nums;
            }
            #root button {
              display: inline-block;
              margin: 0.5rem;
              padding: 0.75rem 1.5rem;
              font-size: 1rem;
              border-radius: 0.5rem;
              border: 1px solid currentColor;
              background: transparent;
              color: inherit;
              cursor: pointer;
              touch-action: manipulation;
              min-height: 44px;
            }
            [data-testid='recovery-cancel'] {
              background: var(--accent);
              color: #fff;
              border-color: var(--accent);
            }
    </style>
    <script type="module" crossorigin src="/v/1.18.0/assets/recovery-Cfr43QMe.js"></script>
    <link rel="modulepreload" crossorigin href="/v/1.18.0/assets/nuke-Cwag5nq9.js">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
